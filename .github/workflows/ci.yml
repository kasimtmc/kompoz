# Builds Kompoz on every platform it runs on and runs what can run there: the headless tests (all
# but Android and the web), the platform tests (Linux: the wallpaper's colors, images, AT-SPI on a
# D-Bus of their own; Windows: UI Automation), and an app (tests/package, the README's first
# example) built against Kompoz as it is installed (cmake --install, vcpkg, Conan), run, clicked
# and photographed: offscreen on Linux, in a real window on Windows and macOS.
name: CI

on:
  push:
    branches: [main, ci]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # What the app does when it runs: waits for its first frames, clicks its button, photographs the result.
  KOMPOZ_SCRIPT_RUN: wait 30;click 70 70;wait 30;shot shot.png;quit

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14, ASan + UBSan
            cc: gcc-14
            cxx: g++-14
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer
          - name: Clang 19
            cc: clang-19
            cxx: clang++-19
            flags: ""
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-14 clang-19 lld-19 dbus \
            libturbojpeg0-dev libwebp-dev libcurl4-openssl-dev libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
          # What SDL's own README lists for Linux
          sudo apt-get install -y --no-install-recommends libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libwayland-dev wayland-protocols libdecor-0-dev liburing-dev
      - uses: actions/cache@v4
        with:
          path: third_party/.downloads
          key: deps-${{ hashFiles('scripts/fetch-deps.sh') }}
      - name: "Dependencies (SDL3, FreeType, HarfBuzz, zlib, libpng from source: no SDL3 package here)"
        run: scripts/fetch-deps.sh
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKOMPOZ_VENDORED_DEPS=ON \
            -DKOMPOZ_WITH_JPEG=ON -DKOMPOZ_WITH_WEBP=ON -DKOMPOZ_WITH_CURL=ON -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build build
      - name: Tests
        run: build/kompoz_tests
      - name: Platform tests
        run: build/kompoz_platform_tests
      # Vulkan on lavapipe (Mesa's, on the CPU), which LeakSanitizer can't follow into, with the
      # validation layers: an error they report fails the test.
      - name: GPU renderer tests (Vulkan on lavapipe, validated, against tests/golden)
        working-directory: build
        env:
          KOMPOZ_GPU_REQUIRED: "1"
          KOMPOZ_GPU_VALIDATION: "1"
          ASAN_OPTIONS: detect_leaks=0
        run: |
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          ./kompoz_gpu_tests
      # The same on OpenGL ES 3 (llvmpipe, through EGL), its debug output's errors failures.
      - name: GPU renderer tests (OpenGL ES 3 on llvmpipe, validated, against tests/golden)
        working-directory: build
        env:
          KOMPOZ_GPU: gles
          KOMPOZ_GPU_REQUIRED: "1"
          KOMPOZ_GPU_VALIDATION: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          ASAN_OPTIONS: detect_leaks=0
        run: ./kompoz_gpu_tests
      - name: Install (with the SDL3, FreeType and HarfBuzz built here), and build an app against it
        run: |
          cmake --install build --prefix "$PWD/install"
          cmake -S tests/package -B build-package -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/install" \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
          cmake --build build-package
      # Kompoz's GPU renderer on Vulkan (lavapipe), drawing only into its kept frame without a window.
      - name: Run it offscreen, click its button, take a screenshot
        working-directory: build-package
        env:
          SDL_VIDEO_DRIVER: offscreen
          # ASan still checks every access; only the leak report at exit is off: it lists what Mesa's drivers and
          # ALSA allocate in libraries already unloaded by then. Kompoz's own leaks are checked by the tests.
          ASAN_OPTIONS: detect_leaks=0
        run: |
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          KOMPOZ_SCRIPT="$KOMPOZ_SCRIPT_RUN" ./demo && test -s shot.png

  windows:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-headers patch tar xz curl
      - uses: actions/cache@v4
        with:
          path: third_party/.downloads
          key: deps-${{ hashFiles('scripts/fetch-deps.sh') }}
      - name: Dependencies
        run: scripts/fetch-deps.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Tests
        run: build/kompoz_tests.exe
      - name: Platform tests (UI Automation)
        run: build/kompoz_platform_tests.exe
      - uses: ./.github/actions/angle
      - name: ANGLE beside the GPU tests
        run: cp angle/x64-windows-release/bin/*.dll build/
      - name: GPU renderer tests (OpenGL ES 3 through ANGLE on Direct3D 11's WARP, validated, against tests/golden)
        working-directory: build
        env:
          KOMPOZ_GPU: gles
          KOMPOZ_GPU_REQUIRED: 1
          KOMPOZ_GPU_VALIDATION: 1
        run: ./kompoz_gpu_tests.exe
      - name: Install (with the SDL3, FreeType and HarfBuzz built here), and build an app against it
        run: |
          cmake --install build --prefix "$PWD/install"
          cmake -S tests/package -B build-package -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-package
      - name: Run it in a window (OpenGL ES through ANGLE beside it), click its button, take a screenshot
        working-directory: build-package
        run: cp ../angle/x64-windows-release/bin/*.dll . && KOMPOZ_SCRIPT="$KOMPOZ_SCRIPT_RUN" ./demo.exe && test -s shot.png

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: brew install ninja sdl3 freetype harfbuzz libpng jpeg-turbo webp
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKOMPOZ_WITH_JPEG=ON -DKOMPOZ_WITH_WEBP=ON -DKOMPOZ_WITH_CURL=ON
      - name: Build
        run: cmake --build build
      - name: Tests
        run: build/kompoz_tests
      - name: GPU renderer tests (Metal, validated, against tests/golden)
        working-directory: build
        env:
          KOMPOZ_GPU_REQUIRED: 1
          KOMPOZ_GPU_VALIDATION: 1
        run: ./kompoz_gpu_tests
      - name: Install, and build an app against it
        run: |
          cmake --install build --prefix "$PWD/install"
          cmake -S tests/package -B build-package -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-package
      - name: Run it in a window (Cocoa, Metal presenting to the window's layer, validated), click its button, take a screenshot
        working-directory: build-package
        env:
          KOMPOZ_GPU_VALIDATION: 1
        run: KOMPOZ_SCRIPT="$KOMPOZ_SCRIPT_RUN" ./demo && test -s shot.png
      # Offscreen: Metal without the window's layer, drawing only into the kept frame.
      - name: Run it offscreen, click its button, take a screenshot
        working-directory: build-package
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: KOMPOZ_SCRIPT="${KOMPOZ_SCRIPT_RUN/shot.png/shot-offscreen.png}" ./demo && test -s shot-offscreen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshot
          path: build-package/shot*.png
          if-no-files-found: ignore

  vcpkg:
    name: vcpkg (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
          - os: windows-latest
            triplet: x64-windows  # (MSVC)
          - os: macos-latest
            triplet: arm64-osx
    defaults:
      run:
        shell: bash
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Packages (what vcpkg's SDL3 and its dependencies need from the system)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-14 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libasound2-dev libpulse-dev autoconf autoconf-archive automake libtool libltdl-dev pkg-config \
            bison flex gettext python3-jinja2 linux-libc-dev libvulkan1 mesa-vulkan-drivers
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: vcpkg
        run: |
          if [ -z "$VCPKG_INSTALLATION_ROOT" ] || { [ ! -x "$VCPKG_INSTALLATION_ROOT/vcpkg" ] && [ ! -x "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" ]; }; then
            git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
            echo "VCPKG_INSTALLATION_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          fi
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('packaging/vcpkg/**') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-
      - name: Install Kompoz with vcpkg
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install kompoz --overlay-ports=packaging/vcpkg/ports \
            --x-install-root="$PWD/vcpkg_installed" --triplet ${{ matrix.triplet }}
      - name: Build an app against it
        run: |
          cmake -S tests/package -B build-package -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$PWD/vcpkg_installed" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_MANIFEST_MODE=OFF
          cmake --build build-package --config Release
      - uses: ./.github/actions/angle
        if: runner.os == 'Windows'
      - name: Run it, click its button, take a screenshot (offscreen on Linux, in a window elsewhere)
        run: |
          app=$(find build-package -type f \( -name demo -o -name demo.exe \) | head -1)
          cd "$(dirname "$app")"
          # Linux: Vulkan on lavapipe without a window; Windows: OpenGL ES through ANGLE beside it.
          if [ "$RUNNER_OS" = Linux ]; then export SDL_VIDEO_DRIVER=offscreen VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"; fi
          if [ "$RUNNER_OS" = Windows ]; then cp "$GITHUB_WORKSPACE"/angle/x64-windows-release/bin/*.dll .; fi
          KOMPOZ_SCRIPT="$KOMPOZ_SCRIPT_RUN" "./$(basename "$app")" && test -s shot.png
      - name: The logs of what failed
        if: failure()
        run: find "$VCPKG_INSTALLATION_ROOT/buildtrees" -name '*-err.log' -mmin -120 -exec tail -40 {} + 2>/dev/null | tail -200

  conan:
    name: Conan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Conan
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends g++-14 ninja-build libvulkan1 mesa-vulkan-drivers
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
            export CC=gcc-14 CXX=g++-14
          fi
          pipx install conan
          conan profile detect
          if [ "$RUNNER_OS" = Linux ]; then  # (a mirror's chain that Python's own certificates don't verify)
            echo "core.net.http:cacert_path=/etc/ssl/certs/ca-certificates.crt" >> "$(conan config home)/global.conf"
          fi
      - uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ hashFiles('packaging/conan/conanfile.py') }}
          restore-keys: conan-${{ matrix.os }}-
      # Conan Center's SDL has no OpenGL ES on Windows (so no ANGLE): the demo draws with Vulkan
      # there too, on Mesa's lavapipe as built for Windows by mesa-dist-win.
      - uses: actions/cache@v4
        if: runner.os == 'Windows'
        id: mesa
        with:
          path: mesa
          key: mesa-dist-win-26.2.4
      - name: Mesa's lavapipe for Windows
        if: runner.os == 'Windows' && steps.mesa.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
          7z x -omesa mesa.7z > /dev/null
      - name: Create the package and test it (packaging/conan/test_package)
        run: |
          extra=()
          # The test's demo draws with Vulkan on lavapipe (Mesa's on Linux, mesa-dist-win's on Windows).
          if [ "$RUNNER_OS" = Linux ]; then export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"; fi
          if [ "$RUNNER_OS" = Windows ]; then
            icd="$(find "$PWD/mesa" -path '*x64*' -name 'lvp_icd*.json' | head -n 1)"
            [ -n "$icd" ] || { echo "no lavapipe in mesa-dist-win's archive:"; find mesa -maxdepth 2 | head -n 40; exit 1; }
            # Run elevated, Windows' Vulkan loader ignores VK_DRIVER_FILES: the driver is registered.
            MSYS_NO_PATHCONV=1 reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$(cygpath -w "$icd")" /t REG_DWORD /d 0 /f
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            extra=(-c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True
                   -c 'tools.build:compiler_executables={"c": "gcc-14", "cpp": "g++-14"}')
          fi
          conan create packaging/conan --build=missing -s compiler.cppstd=20 -s build_type=Release "${extra[@]}"

  android:
    name: Android (the showcase's APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: third_party/.downloads
          key: deps-${{ hashFiles('scripts/fetch-deps.sh') }}
      - name: Dependencies
        run: scripts/fetch-deps.sh
      - name: NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null
      - name: Build
        working-directory: examples/showcase/android
        run: ./gradlew --no-daemon assembleDebug

  web:
    name: Web (Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - uses: actions/cache@v4
        with:
          path: third_party/.downloads
          key: deps-${{ hashFiles('scripts/fetch-deps.sh') }}
      - name: Dependencies
        run: scripts/fetch-deps.sh
      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DKOMPOZ_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-web --target showcase kompoz_gpu_tests -j4
      - name: GPU renderer tests (WebGL 2 on Chrome's SwiftShader, against tests/golden)
        run: >
          emrun --browser chrome --kill_exit --timeout 1800
          --browser_args="--headless=new --no-sandbox --use-angle=swiftshader --enable-unsafe-swiftshader"
          build-web/kompoz_gpu_tests.html KOMPOZ_GPU_REQUIRED=1
      - name: GPU renderer tests (WebGPU on Chrome's SwiftShader, against tests/golden)
        run: >
          emrun --browser chrome --kill_exit --timeout 1800
          --browser_args="--headless=new --no-sandbox --enable-unsafe-webgpu --use-webgpu-adapter=swiftshader --enable-features=Vulkan"
          build-web/kompoz_gpu_tests.html KOMPOZ_GPU=webgpu KOMPOZ_GPU_REQUIRED=1

  shaders:
    name: Shaders (the committed headers are what their sources compile to)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: third_party/.tools
          key: shader-tools-${{ hashFiles('scripts/shaders.py') }}
      - name: Compile every shader for every backend, compare with platform/gpu/shaders/generated
        run: python3 scripts/shaders.py --check
