# Builds Kompoz on every platform it runs on and runs its tests where they can run: the headless
# tests everywhere but Android and the web, the platform tests on Linux (the wallpaper's colors,
# AT-SPI on a D-Bus of their own) and Windows (UI Automation). macOS is built and tested here too,
# although its backend hasn't been tried on a Mac.
name: CI

on:
  push:
    branches: [main, ci]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14, ASan + UBSan
            cc: gcc-14
            cxx: g++-14
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer
          - name: Clang 19
            cc: clang-19
            cxx: clang++-19
            flags: ""
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-14 clang-19 lld-19 dbus \
            libturbojpeg0-dev libwebp-dev libcurl4-openssl-dev
          # What SDL's own README lists for Linux
          sudo apt-get install -y --no-install-recommends libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libwayland-dev wayland-protocols libdecor-0-dev liburing-dev
      - uses: actions/cache@v4
        with:
          path: third_party/.downloads
          key: deps-${{ hashFiles('scripts/fetch-deps.sh') }}
      - name: "Dependencies (SDL3, FreeType, HarfBuzz from source: no SDL3 package here)"
        run: scripts/fetch-deps.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKOMPOZ_VENDORED_DEPS=ON -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build build
      - name: Tests
        run: build/kompoz_tests
      - name: Platform tests
        run: build/kompoz_platform_tests

  windows:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            patch tar xz curl
      - uses: actions/cache@v4
        with:
          path: third_party/.downloads
          key: deps-${{ hashFiles('scripts/fetch-deps.sh') }}
      - name: Dependencies
        run: scripts/fetch-deps.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Tests
        run: build/kompoz_tests.exe
      - name: Platform tests (UI Automation)
        run: build/kompoz_platform_tests.exe

  macos:
    name: "macOS (headless tests, the package, an app run offscreen)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: brew install ninja sdl3 freetype harfbuzz jpeg-turbo webp
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Tests
        run: build/kompoz_tests
      - name: Install, and build an app against the package
        run: |
          cmake --install build --prefix "$PWD/install"
          cmake -S tests/package -B build-package -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-package
      - name: Run it offscreen (software rendering), click its button, take a screenshot
        working-directory: build-package
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_RENDER_DRIVER: software  # (offscreen would want EGL for OpenGL, which macOS hasn't)
          KOMPOZ_SCRIPT: wait 5;click 70 70;wait 5;shot offscreen.png;quit
        run: |
          ./demo || echo "demo exited with $?"
          ls -la
          test -s offscreen.png
      - name: Run it in a real window (Cocoa, Metal), the same
        if: success() || failure()
        working-directory: build-package
        continue-on-error: true  # (first tries: whether the runner's session gives it a window)
        env:
          KOMPOZ_SCRIPT: wait 30;click 70 70;wait 30;shot cocoa.png;quit
        run: |
          ./demo || echo "demo exited with $?"
          ls -la
          test -s cocoa.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshots
          path: build-package/*.png
          if-no-files-found: ignore

  vcpkg:
    name: vcpkg (the overlay port, and an app built with it)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages (what SDL needs from the system to build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-14 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libasound2-dev libpulse-dev autoconf autoconf-archive automake libtool pkg-config
      - name: Install Kompoz with vcpkg
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install kompoz --overlay-ports=packaging/vcpkg/ports \
            --x-install-root="$PWD/vcpkg_installed" --triplet x64-linux
      - name: Build an app against it
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S tests/package -B build-package -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$PWD/vcpkg_installed" -DVCPKG_MANIFEST_MODE=OFF
          cmake --build build-package
      - name: Run it offscreen, click its button, take a screenshot
        working-directory: build-package
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_RENDER_DRIVER: software
          KOMPOZ_SCRIPT: wait 5;click 70 70;wait 5;shot vcpkg.png;quit
        run: ./demo && test -s vcpkg.png
      - name: The logs of what failed
        if: failure()
        run: find "$VCPKG_INSTALLATION_ROOT/buildtrees" -name '*-err.log' -newer packaging -exec tail -40 {} + 2>/dev/null | tail -200

  conan:
    name: Conan (the recipe, and an app built with it)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Conan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build
          pipx install conan
          conan profile detect
      - name: Create the package and test it (packaging/conan/test_package)
        run: |
          conan create packaging/conan --build=missing -s compiler.cppstd=20 -s build_type=Release \
            -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True \
            -c tools.build:compiler_executables='{"c": "gcc-14", "cpp": "g++-14"}' \
            -c tools.cmake.cmaketoolchain:generator=Ninja

  android:
    name: Android (the showcase's APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: third_party/.downloads
          key: deps-${{ hashFiles('scripts/fetch-deps.sh') }}
      - name: Dependencies
        run: scripts/fetch-deps.sh
      - name: NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null
      - name: Build
        working-directory: examples/showcase/android
        run: ./gradlew --no-daemon assembleDebug

  web:
    name: Web (Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - uses: actions/cache@v4
        with:
          path: third_party/.downloads
          key: deps-${{ hashFiles('scripts/fetch-deps.sh') }}
      - name: Dependencies
        run: scripts/fetch-deps.sh
      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DKOMPOZ_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build-web --target showcase -j4
